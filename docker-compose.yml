version: '3.8'

networks:
  swift-network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: swift-postgres
    environment:
      POSTGRES_DB: swiftlogistics
      POSTGRES_USER: swift_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - swift-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swift_user -d swiftlogistics"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swift-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - swift-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5