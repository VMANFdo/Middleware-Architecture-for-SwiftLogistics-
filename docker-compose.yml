name: swifttrack

networks:
  swift-network:
    driver: bridge

volumes:
  pgdata:

services:
  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: swift-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: swifttrack
      POSTGRES_USER: swift_admin
      POSTGRES_PASSWORD: swift_pw_dev_only
 #   ports:
    #  - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swift_admin -d swifttrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - swift-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swift-rabbitmq
    restart: unless-stopped
    init: true
    environment:
      RABBITMQ_DEFAULT_USER: swift_admin
      RABBITMQ_DEFAULT_PASS: swift_pw_dev_only
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI (http://127.0.0.1:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - swift-network

  # ---------------------------------------------------------------------
  # Backend business systems (owned by M1 / M2 / M3 — Phase 2)
  # Build contexts below assume each teammate creates a Dockerfile in
  # their respective folder. Placeholders until Phase 2 lands.
  # ---------------------------------------------------------------------
  cms-service:
    build:
      context: ./cms-service
    container_name: swift-cms
    restart: unless-stopped
    init: true
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://swift_admin:swift_pw_dev_only@postgres:5432/swifttrack
      RABBITMQ_URL: amqp://swift_admin:swift_pw_dev_only@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - swift-network

  ros-service:
    build:
      context: ./ros-service
    container_name: swift-ros
    restart: unless-stopped
    init: true
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_URL: amqp://swift_admin:swift_pw_dev_only@rabbitmq:5672
      DATABASE_URL: postgresql://swift_admin:swift_pw_dev_only@postgres:5432/swifttrack
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - swift-network

  wms-service:
    build:
      context: ./wms-service
    container_name: swift-wms
    restart: unless-stopped
    init: true
    ports:
      - "8003:8003"  # REST/health
      - "9000:9000"  # proprietary TCP protocol
    environment:
      DATABASE_URL: postgresql://swift_admin:swift_pw_dev_only@postgres:5432/swifttrack
      RABBITMQ_URL: amqp://swift_admin:swift_pw_dev_only@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - swift-network

  # ---------------------------------------------------------------------
  # API Gateway (M4 — Phase 1 scaffold, Phase 3/5 protocol bridging + saga)
  # ---------------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
    container_name: swift-gateway
    restart: unless-stopped
    init: true
    ports:
      - "${API_GATEWAY_HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://swift_admin:swift_pw_dev_only@postgres:5432/swifttrack
      RABBITMQ_URL: amqp://swift_admin:swift_pw_dev_only@rabbitmq:5672
      CMS_SOAP_URL: http://cms-service:8001/soap
      CMS_REST_URL: http://cms-service:8001
      ROS_REST_URL: http://ros-service:8002
      WMS_TCP_HOST: wms-service
      WMS_TCP_PORT: 9000
      JWT_SECRET: ${JWT_SECRET:-swiftlogistics-secret-key-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      cms-service:
        condition: service_healthy
      ros-service:
        condition: service_healthy
      wms-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - swift-network

  # ---------------------------------------------------------------------
  # Frontends (M5 / M6 — Phase 4)
  # ---------------------------------------------------------------------
  client-portal:
    build:
      context: ./client-portal
    container_name: swift-client-portal
    restart: unless-stopped
    init: true
    ports:
      - "${CLIENT_PORTAL_HOST_PORT:-8080}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swift-network

  driver-app:
    build:
      context: ./driver-app
    container_name: swift-driver-app
    restart: unless-stopped
    init: true
    ports:
      - "${DRIVER_PORTAL_HOST_PORT:-8081}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swift-network
